<!DOCTYPE html>

<head>

<style>
:root{--bg:#09090f;--bg2:#111118;--bg3:#18181f;--bg4:#222230;--border:#2a2a3a;--border2:#3a3a50;--text:#e8e8f0;--text2:#9090a8;--text3:#5a5a70;--accent:#7c6dff;--accent2:#a594ff;--accent-bg:#1a1730;--green:#4ade80;--green-bg:#0d2018;--green-border:#1a4030;--red:#f87171;--red-bg:#200d0d;--red-border:#401a1a;--yellow:#fbbf24;--yellow-bg:#1f1500;--yellow-border:#3a2a00;--orange:#fb923c;--blue:#60a5fa;--pink:#f472b6;--mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif;--radius:10px;--radius-lg:16px}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(124,109,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(124,109,255,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.glow-blob{position:fixed;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(124,109,255,.08) 0%,transparent 70%);top:-200px;right:-200px;pointer-events:none;z-index:0}
header{position:relative;z-index:10;padding:18px 32px;border-bottom:1px solid var(--border);background:rgba(9,9,15,.85);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo-wrap{display:flex;align-items:center;gap:12px}
.logo-icon{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;font-family:var(--mono)}
.logo-text{font-size:16px;font-weight:700}.logo-sub{font-size:11px;color:var(--text3);font-family:var(--mono)}
.header-right{display:flex;align-items:center;gap:12px}
.header-badge{font-family:var(--mono);font-size:11px;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);color:var(--text3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn-back{display:flex;align-items:center;gap:7px;padding:6px 14px;background:rgba(124,109,255,.1);border:1px solid rgba(124,109,255,.3);border-radius:8px;color:#a594ff;font-size:12px;font-weight:600;text-decoration:none;font-family:var(--mono);white-space:nowrap;transition:border-color .15s,background .15s}
.btn-back:hover{border-color:#7c6dff;background:rgba(124,109,255,.2)}
.container{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:28px 24px;display:grid;grid-template-columns:300px 1fr;gap:22px;min-height:calc(100vh - 73px)}
.panel-left{display:flex;flex-direction:column;gap:10px}
.panel-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;font-family:var(--mono);padding:0 4px;margin-bottom:2px}
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap}
.filter-tab{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;font-family:var(--mono);cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text3);transition:all .15s}
.filter-tab:hover{border-color:var(--border2);color:var(--text2)}.filter-tab.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent2)}
.progress-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px}
.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.progress-label{font-size:11px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.progress-count{font-size:13px;font-family:var(--mono);font-weight:700;color:var(--accent2)}
.progress-bar-bg{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));border-radius:2px;transition:width .4s ease}
.q-list{display:flex;flex-direction:column;gap:7px;overflow-y:auto;max-height:calc(100vh - 230px);padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.q-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;cursor:pointer;transition:border-color .15s,background .15s;position:relative;overflow:hidden}

.q-card:hover{border-color:var(--border2);background:var(--bg3)}.q-card.active{border-color:var(--accent);background:var(--accent-bg)}.q-card.active::before{opacity:1}

.q-card.done-partial{border-color:var(--yellow-border)}.q-card.done-partial::before{background:var(--yellow);opacity:1}
.q-card.done-fail{border-color:var(--red-border)}.q-card.done-fail::before{background:var(--red);opacity:1}
.q-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}

.panel-right{display:flex;flex-direction:column;gap:14px}
.q-display{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 26px}
.q-display-num{font-family:var(--mono);font-size:11px;color:var(--accent2);font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:9px}
.q-display-title{font-size:18px;font-weight:700;margin-bottom:11px}
.q-display-desc{font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.7;font-family:var(--mono)}.q-display-desc strong{color:var(--accent2)}
.requirement-box{background:var(--bg3);border:1px solid var(--border2);border-left:3px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;padding:12px 15px;margin-top:10px}
.req-label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.req-list{list-style:none;display:flex;flex-direction:column;gap:4px}.req-list li{font-size:12px;color:var(--text2);font-family:var(--mono);display:flex;align-items:flex-start;gap:8px}.req-list li::before{content:'→';color:var(--accent);flex-shrink:0;margin-top:1px}

.io-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px}
.io-label{font-size:10px;font-family:var(--mono);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.io-label.in{color:var(--blue)}.io-label.out{color:var(--green)}
.io-content{font-family:var(--mono);font-size:12px;color:var(--text2);white-space:pre;line-height:1.6}
.editor-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column}
.editor-header{padding:11px 15px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.editor-title{font-size:12px;font-family:var(--mono);color:var(--text2);display:flex;align-items:center;gap:7px}
.editor-dot{width:10px;height:10px;border-radius:50%}.dot-r{background:#ff5f57}.dot-y{background:#febc2e}.dot-g{background:#28c840}
.editor-actions{display:flex;align-items:center;gap:7px}
.btn-small{font-family:var(--mono);font-size:11px;color:var(--text3);background:none;border:1px solid var(--border);padding:4px 10px;border-radius:6px;cursor:pointer;transition:all .15s}.btn-small:hover{border-color:var(--border2);color:var(--text2)}
.btn-check{font-family:var(--sans);font-size:13px;font-weight:700;color:#fff;background:var(--accent);border:none;padding:8px 22px;border-radius:8px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px;letter-spacing:.02em}.btn-check:hover{background:#6b5ce8;transform:translateY(-1px)}.btn-check:active{transform:translateY(0)}
textarea#code-input{width:100%;min-height:300px;background:var(--bg);border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:12.5px;line-height:1.75;padding:18px 22px;resize:vertical;tab-size:4}

.result-panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;display:none;animation:slideUp .3s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.result-panel.show{display:block}
.result-header{padding:16px 22px;display:flex;align-items:center;justify-content:space-between}
.result-header.verdict-ok{background:var(--green-bg);border-bottom:1px solid var(--green-border)}
.result-header.verdict-partial{background:var(--yellow-bg);border-bottom:1px solid var(--yellow-border)}

.result-verdict{display:flex;align-items:center;gap:12px}.verdict-icon{font-size:24px;line-height:1}.verdict-text{font-size:16px;font-weight:700}
.verdict-ok .verdict-text{color:var(--green)}.verdict-partial .verdict-text{color:var(--yellow)}.verdict-fail .verdict-text{color:var(--red)}
.verdict-sub{font-size:12px;color:var(--text3);font-family:var(--mono);margin-top:2px}
.score-badge{font-family:var(--mono);font-size:22px;font-weight:700;padding:6px 18px;border-radius:9px}
.verdict-ok .score-badge{background:rgba(74,222,128,.2);color:var(--green)}.verdict-partial .score-badge{background:rgba(251,191,36,.2);color:var(--yellow)}.verdict-fail .score-badge{background:rgba(248,113,113,.2);color:var(--red)}
.result-body{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.result-section{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.rs-header{padding:9px 15px;background:var(--bg3);font-size:11px;font-weight:700;font-family:var(--mono);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.06em;color:var(--text2)}
.rs-body{padding:13px 15px;background:var(--bg);font-size:12px;color:var(--text2);line-height:1.75;font-family:var(--mono);white-space:pre-wrap;word-break:break-word}
.checklist{display:flex;flex-direction:column;gap:5px;padding:11px 15px;background:var(--bg)}
.check-item{display:flex;align-items:flex-start;gap:10px;font-size:12px;color:var(--text2);font-family:var(--mono);line-height:1.5}
.check-icon{flex-shrink:0;margin-top:1px;font-weight:700}.c-ok{color:var(--green)}.c-fail{color:var(--red)}
.token-diff-wrap{padding:12px 15px;background:var(--bg);display:flex;flex-direction:column;gap:12px}
.diff-col-title{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.token-list{display:flex;flex-wrap:wrap;gap:5px}
.token{font-size:11px;font-family:var(--mono);padding:2px 8px;border-radius:4px}
.token.match{background:rgba(74,222,128,.12);color:var(--green);border:1px solid rgba(74,222,128,.25)}
.token.miss{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.25)}
.empty-state{text-align:center;padding:60px 24px;color:var(--text3)}.empty-icon{font-size:44px;margin-bottom:10px}.empty-text{font-size:14px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@media(max-width:960px){.container{grid-template-columns:1fr}.q-list{max-height:260px}}
</style>

<script>

// BÀI MẪU — ẨN, NGƯỜI DÙNG KHÔNG THẤY
const REF = {
  1:`void themcuoi(SList &l,int x){SNode*p=taonut(x);if(l.head==nullptr)l.head=l.tail=p;else{l.tail->next=p;l.tail=p;}}`,
  2:`int dempt(SList l){int dem=0;SNode*p=l.head;while(p!=nullptr){dem++;p=p->next;}return dem;}`,
  3:`bool lascphuong(int n){if(n<0)return false;int s=(int)sqrt((double)n);return s*s==n;}
int tongscphuong(SList l){int tong=0;SNode*p=l.head;while(p!=nullptr){if(lascphuong(p->data))tong+=p->data;p=p->next;}return tong;}`,
  4:`void tachcl(SList l,SList &lc,SList &ll){khoitao(lc);khoitao(ll);SNode*p=l.head;while(p!=nullptr){if(p->data%2==0)themcuoi(lc,p->data);else themcuoi(ll,p->data);p=p->next;}}`,
  5:`void daonguoc(SList &l){SNode*prev=nullptr;SNode*cur=l.head;SNode*nxt=nullptr;l.tail=l.head;while(cur!=nullptr){nxt=cur->next;cur->next=prev;prev=cur;cur=nxt;}l.head=prev;}`,
  6:`int demvanhando(SList &l){int dem=0;SNode*p=l.head;while(p!=nullptr){if(p->data%3==0){p->data*=2;dem++;}p=p->next;}return dem;}`,
  7:`float tblon10(SList l){float tong=0;int dem=0;SNode*p=l.head;while(p!=nullptr){if(p->data>10){tong+=p->data;dem++;}p=p->next;}if(dem==0)return 0;return tong/dem;}`,
  8:`void noidslk(SList &l1,SList l2){if(l2.head==nullptr)return;if(l1.head==nullptr){l1=l2;return;}l1.tail->next=l2.head;l1.tail=l2.tail;}`,
  9:`#define MAX 100
struct Stack{int data[MAX];int top;};
void khoitaostack(Stack &s){s.top=-1;}
bool rong(Stack s){return s.top==-1;}
bool day(Stack s){return s.top==MAX-1;}
void push(Stack &s,int x){if(!day(s))s.data[++s.top]=x;}
int pop(Stack &s){return s.data[s.top--];}
int peek(Stack s){return s.data[s.top];}`,
  10:`void chuyencosobat(int n,int a){Stack s;khoitaostack(s);while(n>0){push(s,n%a);n/=a;}while(!rong(s))cout<<pop(s);cout<<endl;}`,
  11:`bool kiemtrangoac(string st){Stack s;khoitaostack(s);for(int i=0;i<st.size();i++){char c=st[i];if(c=='('||c=='['||c=='{')push(s,c);else if(c==')'||c==']'||c=='}'){if(rong(s))return false;char top=peek(s);if((c==')'&&top=='(')||(c==']'&&top=='[')||(c=='}'&&top=='{'))pop(s);else return false;}}return rong(s);}`,
  12:`int uutien(char c){if(c=='+'||c=='-')return 1;if(c=='*'||c=='/')return 2;return 0;}
void infixtopostfix(string bt){Stack s;khoitaostack(s);for(int i=0;i<bt.size();i++){char c=bt[i];if(isdigit(c)||isalpha(c))cout<<c<<' ';else if(c=='(')push(s,c);else if(c==')'){while(!rong(s)&&peek(s)!='(')cout<<pop(s)<<' ';if(!rong(s))pop(s);}else{while(!rong(s)&&uutien(peek(s))>=uutien(c))cout<<pop(s)<<' ';push(s,c);}}while(!rong(s))cout<<pop(s)<<' ';}`,
  13:`float tinhpostfix(string bt){Stack s;khoitaostack(s);for(int i=0;i<bt.size();i++){char c=bt[i];if(isdigit(c))push(s,c-'0');else if(c=='+'||c=='-'||c=='*'||c=='/'){float b=pop(s);float a=pop(s);if(c=='+')push(s,a+b);else if(c=='-')push(s,a-b);else if(c=='*')push(s,a*b);else push(s,a/b);}}return peek(s);}`
};

// Chỉ lấy tên HÀM được gọi/định nghĩa (vd: taonut, themcuoi, push, sqrt)
// và tên THUỘC TÍNH truy cập qua . hoặc -> (vd: head, tail, next, data, top).
// Đây là phần "API cố định" của đề bài — bắt buộc phải đúng tên.
// Biến cục bộ tự đặt (dem, tong, p, cur, prev, nxt, s, i...) KHÔNG bị so khớp,
// vì đó là phong cách viết của riêng từng người, không phải yêu cầu của đề.
const CTRL_KW=new Set(['if','while','for','switch','return','else','catch','sizeof','define','main']);
function apiTokens(code){
  const c=code.replace(/\/\/[^\n]*/g,'').replace(/\/\*[\s\S]*?\*\//g,'');
  const out=new Set();
  let m;
  const callRe=/\b([a-zA-Z_]\w*)\s*\(/g;
  while((m=callRe.exec(c))){
    const t=m[1].toLowerCase();
    if(!CTRL_KW.has(t))out.add(t);
  }
  const memRe=/(?:->|\.)\s*([a-zA-Z_]\w*)/g;
  while((m=memRe.exec(c))){
    out.add(m[1].toLowerCase());
  }
  return out;
}
function structOf(code){
  const c=code.replace(/\/\/[^\n]*/g,'').replace(/\/\*[\s\S]*?\*\//g,'');
  return{
    while:/\bwhile\b/.test(c),for:/\bfor\b/.test(c),if:/\bif\b/.test(c),
    ret:/\breturn\b/.test(c),null_:/nullptr|NULL/.test(c),
    arrow:/->/.test(c),ref:/&/.test(c),float:/\bfloat\b|\bdouble\b/.test(c),
    struct:/\bstruct\b/.test(c),
    lines:c.split('\n').filter(l=>l.trim()).length
  };
}

let CQ=null,results={},filter='all';

function renderQ(){
  const list=document.getElementById('q-list');
  const filtered=questions.filter(q=>filter==='all'||q.cat===filter);
  list.innerHTML=filtered.map(q=>{
    const r=results[q.id];
    let si='',cc='';
    if(r==='ok'){si='✅';cc='done-ok';}
    else if(r==='partial'){si='🟡';cc='done-partial';}
    else if(r==='fail'){si='❌';cc='done-fail';}
    const stars='★'.repeat(q.diff)+'☆'.repeat(3-q.diff);
    const cl={dslk:'DSLK',stack:'Stack'}[q.cat];
    return`<div class="q-card ${cc} ${CQ?.id===q.id?'active':''}" onclick="selQ(${q.id})">
      <div class="q-card-header">
        <span class="q-tag tag-${q.cat}">${cl}</span>
        <span class="q-status">${si||`<span style="color:var(--text3);font-size:11px;font-family:var(--mono)">${stars}</span>`}</span>
      </div>
      <div class="q-title">Bài ${q.id}. ${q.title}</div>
      <div class="q-meta">Độ khó: ${stars}</div>
    </div>`;
  }).join('');
  const done=Object.keys(results).length,total=questions.length;
  document.getElementById('prog-count').textContent=`${done} / ${total}`;
  document.getElementById('prog-bar').style.width=`${total?(done/total)*100:0}%`;
}

function filterQ(cat,btn){
  filter=cat;
  document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  renderQ();
}

function selQ(id){
  CQ=questions.find(q=>q.id===id);
  renderQ();
  const q=CQ;
  const cl={dslk:'DSLK',stack:'Stack'}[q.cat];
  const stars='★'.repeat(q.diff)+'☆'.repeat(3-q.diff);
  document.getElementById('q-display').innerHTML=`
    <div class="q-display-num"><span class="q-tag tag-${q.cat}" style="margin-right:8px">${cl}</span>Bài ${q.id} &nbsp;·&nbsp; Độ khó: ${stars}</div>
    <div class="q-display-title">${q.title}</div>
    <div class="q-display-desc">${q.desc}</div>
    <div class="requirement-box">
      <div class="req-label">Yêu cầu cần đạt</div>
      <ul class="req-list">${q.req.map(r=>`<li>${r}</li>`).join('')}</ul>
    </div>
    <div class="sample-io">
      <div class="io-box"><div class="io-label in">Input mẫu</div><div class="io-content">${q.si}</div></div>
      <div class="io-box"><div class="io-label out">Output mẫu</div><div class="io-content">${q.so}</div></div>
    </div>`;

}

function clearCode(){

  document.getElementById('result-panel').className='result-panel';
}

function runCheck(){
  const mine=document.getElementById('code-input').value.trim();
  if(!mine){alert('Bạn chưa nhập code!');return;}
  if(!CQ)return;
  const ref=REF[CQ.id]||'';
  const rub=RUB[CQ.id]||[];
  const mL=mine.toLowerCase();

  // 1. Rubric
  const rr=rub.map(r=>({l:r.l,hit:r.t(mL),w:r.w}));
  const tw=rub.reduce((s,r)=>s+r.w,0);
  const gw=rr.filter(r=>r.hit).reduce((s,r)=>s+r.w,0);
  let score=tw?Math.round(gw/tw*100):50;

  // 2. Struct diff
  const sm=structOf(ref),ss=structOf(mine);
  const SK=['while','for','if','ret','null_','arrow','ref','float','struct'];
  const SL={while:'while loop',for:'for loop',if:'if/else',ret:'return',null_:'nullptr/NULL',arrow:'->',ref:'& tham chiếu',float:'float/double',struct:'struct'};
  const sc=SK.filter(k=>sm[k]).map(k=>({l:SL[k],ok:ss[k]===sm[k]}));
  if(sc.length>0){
    const sr=sc.filter(s=>s.ok).length/sc.length;
    score=Math.round(score*0.65+sr*100*0.35);
  }

  // 3. Token diff — chỉ so khớp hàm/thuộc tính API cố định với bài mẫu
  const tr=apiTokens(ref),tm=apiTokens(mine);
  const SKIP=new Set(['','int','void','bool','char','string','if','else','while','for','return','true','false','include','using','namespace','std','cout','cin','endl','struct','new','delete','nullptr','null','main','i','j','k','n','x','a','b','c','l','p','s','0','1','2','3']);
  const ok=t=>t.length>=2&&!SKIP.has(t)&&!/^\d+$/.test(t);
  const matchT=[...tr].filter(t=>ok(t)&&tm.has(t)).slice(0,28);
  const missT=[...tr].filter(t=>ok(t)&&!tm.has(t)).slice(0,18);

  score=Math.max(0,Math.min(100,score));
  let verdict,vc,vi,vl;
  if(score>=80){verdict='ok';vc='verdict-ok';vi='✅';vl='Đạt yêu cầu';}
  else if(score>=45){verdict='partial';vc='verdict-partial';vi='🟡';vl='Đúng một phần';}
  else{verdict='fail';vc='verdict-fail';vi='❌';vl='Chưa đạt';}
  results[CQ.id]=verdict;
  renderQ();

  const rubH=`<div class="result-section">
    <div class="rs-header" style="color:var(--accent2)">📋 Checklist tiêu chí</div>
    <div class="checklist">${rr.map(r=>`<div class="check-item">
      <span class="check-icon ${r.hit?'c-ok':'c-fail'}">${r.hit?'✓':'✗'}</span>
      <span><strong style="color:var(--text)">${r.l}</strong> <span style="color:var(--text3)">(${r.w}đ)</span>
      ${r.hit?'<span style="color:var(--green)"> — có trong code</span>':'<span style="color:var(--red)"> — chưa tìm thấy</span>'}
      </span></div>`).join('')}</div></div>`;

  const structH=sc.length?`<div class="result-section">
    <div class="rs-header" style="color:var(--blue)">🔍 So sánh cấu trúc với bài mẫu</div>
    <div class="checklist">${sc.map(s=>`<div class="check-item">
      <span class="check-icon ${s.ok?'c-ok':'c-fail'}">${s.ok?'✓':'✗'}</span>
      <span><strong style="color:var(--text)">${s.l}</strong>
      ${s.ok?'<span style="color:var(--green)"> — khớp</span>':'<span style="color:var(--red)"> — bài mẫu có, bài bạn chưa có</span>'}
      </span></div>`).join('')}</div></div>`:'';

  const tokenH=(matchT.length||missT.length)?`<div class="result-section">
    <div class="rs-header" style="color:var(--pink)">🧩 Hàm & thuộc tính dùng đúng API</div>
    <div class="token-diff-wrap">
      <div style="font-size:11px;color:var(--text3);margin-bottom:-2px">Chỉ so khớp tên hàm gọi và thuộc tính (head, tail, next, data...) — biến bạn tự đặt tên không bị tính.</div>
      ${matchT.length?`<div><div class="diff-col-title">✓ Có trong bài bạn</div><div class="token-list">${matchT.map(t=>`<span class="token match">${t}</span>`).join('')}</div></div>`:''}
      ${missT.length?`<div><div class="diff-col-title">✗ Bài mẫu có, bài bạn chưa có</div><div class="token-list">${missT.map(t=>`<span class="token miss">${t}</span>`).join('')}</div></div>`:''}
    </div></div>`:'';

  const lineH=`<div class="result-section">
    <div class="rs-header" style="color:var(--text2)">📏 Độ dài code</div>
    <div class="rs-body">Bài mẫu: ${sm.lines} dòng &nbsp;·&nbsp; Bài bạn: ${ss.lines} dòng${Math.abs(ss.lines-sm.lines)>sm.lines*0.6?'&nbsp;&nbsp;<span style="color:var(--yellow)">⚠ Chênh lớn — có thể thiếu hàm</span>':'&nbsp;&nbsp;<span style="color:var(--text3)">OK</span>'}</div></div>`;

  const panel=document.getElementById('result-panel');
  panel.innerHTML=`<div class="result-header ${vc}">
    <div class="result-verdict"><div class="verdict-icon">${vi}</div>
      <div><div class="verdict-text">${vl}</div><div class="verdict-sub">Bài ${CQ.id}: ${CQ.title}</div></div>
    </div><div class="score-badge">${score}/100</div></div>
    <div class="result-body">${rubH}${structH}${tokenH}${lineH}</div>`;
  panel.className='result-panel show';
  panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}

document.addEventListener('DOMContentLoaded',()=>{
  const ta=document.getElementById('code-input');
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart,end=ta.selectionEnd;ta.value=ta.value.substring(0,s)+'    '+ta.value.substring(end);ta.selectionStart=ta.selectionEnd=s+4;}
  });
  renderQ();
});

</script>
</body>
</html>
