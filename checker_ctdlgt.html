<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Checker — CTDLGT HUIT</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090f;
  --bg2: #111118;
  --bg3: #18181f;
  --bg4: #222230;
  --border: #2a2a3a;
  --border2: #3a3a50;
  --text: #e8e8f0;
  --text2: #9090a8;
  --text3: #5a5a70;
  --accent: #7c6dff;
  --accent2: #a594ff;
  --accent-bg: #1a1730;
  --green: #4ade80;
  --green-bg: #0d2018;
  --green-border: #1a4030;
  --red: #f87171;
  --red-bg: #200d0d;
  --red-border: #401a1a;
  --yellow: #fbbf24;
  --yellow-bg: #1f1500;
  --orange: #fb923c;
  --blue: #60a5fa;
  --blue-bg: #0d1525;
  --pink: #f472b6;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Syne', sans-serif;
  --radius: 10px;
  --radius-lg: 16px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
}

/* GRID BACKGROUND */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(124,109,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124,109,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* GLOW */
.glow-blob {
  position: fixed;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(124,109,255,0.08) 0%, transparent 70%);
  top: -200px; right: -200px;
  pointer-events: none;
  z-index: 0;
}

/* HEADER */
header {
  position: relative;
  z-index: 10;
  padding: 20px 32px;
  border-bottom: 1px solid var(--border);
  background: rgba(9,9,15,0.8);
  backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 800;
  color: white;
  font-family: var(--mono);
}

.logo-text {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}

.logo-sub {
  font-size: 11px;
  color: var(--text3);
  font-family: var(--mono);
}

.header-badge {
  font-family: var(--mono);
  font-size: 11px;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 6px;
}

.dot-live {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%,100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* MAIN LAYOUT */
.container {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 24px;
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 24px;
  min-height: calc(100vh - 77px);
}

/* LEFT PANEL — QUESTION LIST */
.panel-left {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.panel-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-family: var(--mono);
  padding: 0 4px;
  margin-bottom: 4px;
}

/* FILTER TABS */
.filter-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.filter-tab {
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--mono);
  cursor: pointer;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text3);
  transition: all 0.15s;
}

.filter-tab:hover { border-color: var(--border2); color: var(--text2); }
.filter-tab.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent2); }

/* QUESTION CARDS */
.q-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  max-height: calc(100vh - 200px);
  padding-right: 4px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.q-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  position: relative;
  overflow: hidden;
}

.q-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--accent);
  opacity: 0;
  transition: opacity 0.15s;
}

.q-card:hover { border-color: var(--border2); background: var(--bg3); }
.q-card.active { border-color: var(--accent); background: var(--accent-bg); }
.q-card.active::before { opacity: 1; }
.q-card.done-correct { border-color: var(--green-border); }
.q-card.done-correct::before { background: var(--green); opacity: 1; }
.q-card.done-wrong { border-color: var(--red-border); }
.q-card.done-wrong::before { background: var(--red); opacity: 1; }

.q-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.q-tag {
  font-size: 10px;
  font-family: var(--mono);
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.tag-dslk { background: rgba(96,165,250,0.15); color: var(--blue); }
.tag-stack { background: rgba(74,222,128,0.15); color: var(--green); }
.tag-avl { background: rgba(251,146,60,0.15); color: var(--orange); }
.tag-hash { background: rgba(244,114,182,0.15); color: var(--pink); }

.q-status {
  font-size: 14px;
}

.q-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  line-height: 1.4;
}

.q-meta {
  font-size: 11px;
  color: var(--text3);
  font-family: var(--mono);
}

/* DIFFICULTY STARS */
.diff {
  display: inline-flex;
  gap: 2px;
  font-size: 10px;
}

/* RIGHT PANEL — EDITOR + RESULT */
.panel-right {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* QUESTION DISPLAY */
.q-display {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
}

.q-display-num {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent2);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 10px;
}

.q-display-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--text);
}

.q-display-desc {
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 16px;
  line-height: 1.7;
  font-family: var(--mono);
}

.q-display-desc strong { color: var(--accent2); }

.requirement-box {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 14px 16px;
  margin-top: 12px;
}

.req-label {
  font-size: 10px;
  font-family: var(--mono);
  font-weight: 700;
  color: var(--accent2);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
}

.req-list {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.req-list li {
  font-size: 12px;
  color: var(--text2);
  font-family: var(--mono);
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.req-list li::before {
  content: '→';
  color: var(--accent);
  flex-shrink: 0;
  margin-top: 1px;
}

/* SAMPLE IO */
.sample-io {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 14px;
}

.io-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
}

.io-label {
  font-size: 10px;
  font-family: var(--mono);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

.io-label.in { color: var(--blue); }
.io-label.out { color: var(--green); }

.io-content {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text2);
  white-space: pre;
  line-height: 1.6;
}

/* CODE EDITOR */
.editor-wrap {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.editor-header {
  padding: 12px 16px;
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.editor-title {
  font-size: 12px;
  font-family: var(--mono);
  color: var(--text2);
  display: flex;
  align-items: center;
  gap: 8px;
}

.editor-dot { width: 10px; height: 10px; border-radius: 50%; }
.dot-r { background: #ff5f57; }
.dot-y { background: #febc2e; }
.dot-g { background: #28c840; }

.editor-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-clear {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text3);
  background: none;
  border: 1px solid var(--border);
  padding: 5px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-clear:hover { border-color: var(--border2); color: var(--text2); }

.btn-submit {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 700;
  color: white;
  background: var(--accent);
  border: none;
  padding: 8px 20px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: 0.02em;
}

.btn-submit:hover { background: #6b5ce8; transform: translateY(-1px); }
.btn-submit:active { transform: translateY(0); }
.btn-submit:disabled { background: var(--bg4); color: var(--text3); cursor: not-allowed; transform: none; }

.btn-submit .spinner {
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: none;
}

.btn-submit.loading .spinner { display: block; }
.btn-submit.loading .btn-text { display: none; }

@keyframes spin { to { transform: rotate(360deg); } }

textarea#code-input {
  width: 100%;
  min-height: 320px;
  background: var(--bg);
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.7;
  padding: 20px 24px;
  resize: vertical;
  tab-size: 4;
}

textarea#code-input::placeholder {
  color: var(--text3);
  font-style: italic;
}

/* RESULT PANEL */
.result-panel {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  display: none;
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-panel.show { display: block; }

.result-header {
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.result-header.correct { background: var(--green-bg); border-bottom: 1px solid var(--green-border); }
.result-header.partial { background: var(--yellow-bg); border-bottom: 1px solid #3a2a00; }
.result-header.wrong { background: var(--red-bg); border-bottom: 1px solid var(--red-border); }
.result-header.error { background: var(--bg3); border-bottom: 1px solid var(--border); }

.result-verdict {
  display: flex;
  align-items: center;
  gap: 12px;
}

.verdict-icon {
  font-size: 24px;
  line-height: 1;
}

.verdict-text {
  font-size: 16px;
  font-weight: 700;
}

.correct .verdict-text { color: var(--green); }
.partial .verdict-text { color: var(--yellow); }
.wrong .verdict-text { color: var(--red); }
.error .verdict-text { color: var(--text2); }

.verdict-sub {
  font-size: 12px;
  color: var(--text3);
  font-family: var(--mono);
  margin-top: 2px;
}

.score-badge {
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 700;
  padding: 6px 16px;
  border-radius: 8px;
}

.correct .score-badge { background: rgba(74,222,128,0.2); color: var(--green); }
.partial .score-badge { background: rgba(251,191,36,0.2); color: var(--yellow); }
.wrong .score-badge { background: rgba(248,113,113,0.2); color: var(--red); }

.result-body {
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* SECTION BLOCKS IN RESULT */
.result-section {
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
}

.rs-header {
  padding: 10px 16px;
  background: var(--bg3);
  font-size: 12px;
  font-weight: 700;
  font-family: var(--mono);
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.rs-body {
  padding: 14px 16px;
  background: var(--bg);
  font-size: 13px;
  color: var(--text2);
  line-height: 1.75;
  font-family: var(--mono);
  white-space: pre-wrap;
  word-break: break-word;
}

/* CHECKLIST */
.checklist {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 16px;
  background: var(--bg);
}

.check-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 12px;
  color: var(--text2);
  font-family: var(--mono);
  line-height: 1.5;
}

.check-icon { flex-shrink: 0; margin-top: 1px; }
.check-ok { color: var(--green); }
.check-no { color: var(--red); }
.check-warn { color: var(--yellow); }

/* LOADING STATE */
.loading-overlay {
  padding: 40px 24px;
  text-align: center;
  display: none;
}

.loading-overlay.show { display: block; }

.loading-bar-wrap {
  width: 200px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  margin: 16px auto 0;
  overflow: hidden;
}

.loading-bar {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  animation: loadbar 1.5s ease-in-out infinite;
}

@keyframes loadbar {
  0% { width: 0%; margin-left: 0; }
  50% { width: 60%; margin-left: 20%; }
  100% { width: 0%; margin-left: 100%; }
}

.loading-text {
  font-size: 13px;
  color: var(--text3);
  font-family: var(--mono);
  animation: blink 1.5s ease infinite;
}

@keyframes blink {
  0%,100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* EMPTY STATE */
.empty-state {
  text-align: center;
  padding: 60px 24px;
  color: var(--text3);
}

.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 14px; }

/* PROGRESS BAR */
.progress-section {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 18px;
}

.progress-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.progress-label {
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.progress-count {
  font-size: 13px;
  font-family: var(--mono);
  font-weight: 700;
  color: var(--accent2);
}

.progress-bar-bg {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--pink));
  border-radius: 2px;
  transition: width 0.4s ease;
}

/* API KEY BAR */
.api-key-bar {
  position: relative;
  z-index: 10;
  padding: 10px 32px;
  background: rgba(9,9,15,0.9);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.api-key-label {
  font-size: 11px;
  font-family: var(--mono);
  font-weight: 700;
  color: var(--text3);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}

.gemini-badge {
  font-size: 10px;
  font-family: var(--mono);
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(66,133,244,0.15);
  color: #60a5fa;
  border: 1px solid rgba(66,133,244,0.3);
}

.api-key-input-wrap {
  flex: 1;
  min-width: 260px;
  max-width: 480px;
  position: relative;
  display: flex;
  align-items: center;
}

#api-key-input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 7px 38px 7px 12px;
  outline: none;
  transition: border-color 0.15s;
}

#api-key-input:focus { border-color: var(--accent); }
#api-key-input::placeholder { color: var(--text3); }

.btn-toggle-key {
  position: absolute;
  right: 10px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text3);
  font-size: 14px;
  padding: 2px;
  line-height: 1;
  transition: color 0.15s;
}
.btn-toggle-key:hover { color: var(--text2); }

.api-key-hint {
  font-size: 11px;
  color: var(--text3);
  font-family: var(--mono);
}

.api-key-hint a {
  color: var(--accent2);
  text-decoration: none;
}
.api-key-hint a:hover { text-decoration: underline; }

.api-key-status {
  font-size: 11px;
  font-family: var(--mono);
  padding: 4px 10px;
  border-radius: 6px;
  display: none;
}
.api-key-status.ok { display: inline-block; background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.api-key-status.missing { display: inline-block; background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* RESPONSIVE */
@media (max-width: 900px) {
  .container { grid-template-columns: 1fr; }
  .q-list { max-height: 300px; }
}
</style>
</head>
<body>

<div class="glow-blob"></div>

<header>
  <div class="logo-wrap">
    <div class="logo-icon">C+</div>
    <div>
      <div class="logo-text">Code Checker</div>
      <div class="logo-sub">CTDLGT — HUIT 2025-2026</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:12px;margin-left:auto">
    <a href="index.html" style="
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      background: rgba(124,109,255,0.1);
      border: 1px solid rgba(124,109,255,0.3);
      border-radius: 8px;
      color: #a594ff;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      font-family: var(--mono);
      white-space: nowrap;
      transition: border-color 0.15s, background 0.15s;
    " onmouseover="this.style.borderColor='#7c6dff';this.style.background='rgba(124,109,255,0.2)'"
       onmouseout="this.style.borderColor='rgba(124,109,255,0.3)';this.style.background='rgba(124,109,255,0.1)'">
      ← Tài liệu ôn tập
    </a>
    <div class="header-badge">
      <div class="dot-live"></div>
      Gemini-Powered Grading
    </div>
  </div>
</header>

<!-- API KEY BAR -->
<div class="api-key-bar">
  <div class="api-key-label">
    🔑 Gemini API Key

// ===== STATE =====
let currentQ = null;
let results = {};
let currentFilter = 'all';

// ===== RENDER QUESTIONS =====
function renderQuestions() {
  const list = document.getElementById('q-list');
  const filtered = questions.filter(q => currentFilter === 'all' || q.cat === currentFilter);
  
  list.innerHTML = filtered.map(q => {
    const status = results[q.id];
    let statusIcon = '';
    let cardClass = '';
    if (status === 'correct') { statusIcon = '✅'; cardClass = 'done-correct'; }
    else if (status === 'partial') { statusIcon = '🟡'; cardClass = 'done-wrong'; }
    else if (status === 'wrong') { statusIcon = '❌'; cardClass = 'done-wrong'; }
    
    const stars = '★'.repeat(q.diff) + '☆'.repeat(3 - q.diff);
    const catLabel = {dslk:'DSLK', stack:'Stack', avl:'AVL', hash:'Hash'}[q.cat];
    const tagClass = 'tag-' + q.cat;

    return `<div class="q-card ${cardClass} ${currentQ?.id === q.id ? 'active' : ''}" onclick="selectQ(${q.id})">
      <div class="q-card-header">
        <span class="q-tag ${tagClass}">${catLabel}</span>
        <span class="q-status">${statusIcon || `<span style="color:var(--text3);font-size:11px;font-family:var(--mono)">${stars}</span>`}</span>
      </div>
      <div class="q-title">Bài ${q.id}. ${q.title}</div>
      <div class="q-meta">Độ khó: ${stars}</div>
    </div>`;
  }).join('');

  updateProgress();
}

function updateProgress() {
  const done = Object.keys(results).length;
  const total = questions.length;
  document.getElementById('prog-count').textContent = `${done} / ${total}`;
  document.getElementById('prog-bar').style.width = `${(done/total)*100}%`;
}

function filterQ(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderQuestions();
}

// ===== SELECT QUESTION =====
function selectQ(id) {
  currentQ = questions.find(q => q.id === id);
  renderQuestions();
  
  document.getElementById('editor-wrap').style.display = 'flex';
  document.getElementById('editor-wrap').style.flexDirection = 'column';
  document.getElementById('result-panel').className = 'result-panel';
  document.getElementById('loading-overlay').className = 'loading-overlay';
  document.getElementById('code-input').value = '';

  const q = currentQ;
  const catLabel = {dslk:'DSLK', stack:'Stack', avl:'AVL', hash:'Hash'}[q.cat];
  const tagClass = 'tag-' + q.cat;
  const stars = '★'.repeat(q.diff) + '☆'.repeat(3 - q.diff);

  document.getElementById('q-display').innerHTML = `
    <div class="q-display-num">
      <span class="q-tag ${tagClass}" style="margin-right:8px">${catLabel}</span>
      Bài ${q.id} &nbsp;·&nbsp; Độ khó: ${stars}
    </div>
    <div class="q-display-title">${q.title}</div>
    <div class="q-display-desc">${q.desc}</div>

    <div class="requirement-box">
      <div class="req-label">Yêu cầu cần đạt</div>
      <ul class="req-list">
        ${q.requirements.map(r => `<li>${r}</li>`).join('')}
      </ul>
    </div>

    <div class="sample-io">
      <div class="io-box">
        <div class="io-label in">Input mẫu</div>
        <div class="io-content">${q.sampleIn}</div>
      </div>
      <div class="io-box">
        <div class="io-label out">Output mẫu</div>
        <div class="io-content">${q.sampleOut}</div>
      </div>
    </div>
  `;
  
  // Scroll to editor
  document.getElementById('editor-wrap').scrollIntoView({behavior:'smooth', block:'nearest'});
}

// ===== API KEY HELPERS =====
const STORAGE_KEY = 'ctdlgt_gemini_key';

function getApiKey() {
  return document.getElementById('api-key-input').value.trim();
}

function onKeyInput() {
  const key = getApiKey();
  const status = document.getElementById('key-status');
  if (key.length > 20) {
    status.textContent = '✓ Đã lưu';
    status.className = 'api-key-status ok';
    localStorage.setItem(STORAGE_KEY, key);
  } else if (key.length > 0) {
    status.textContent = '⚠ Key quá ngắn';
    status.className = 'api-key-status missing';
    localStorage.removeItem(STORAGE_KEY);
  } else {
    status.textContent = '';
    status.className = 'api-key-status';
    localStorage.removeItem(STORAGE_KEY);
  }
}

function loadSavedKey() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    document.getElementById('api-key-input').value = saved;
    onKeyInput();
  }
}

function toggleKeyVisibility() {
  const input = document.getElementById('api-key-input');
  input.type = input.type === 'password' ? 'text' : 'password';
}

// ===== SUBMIT CODE =====
async function submitCode() {
  const code = document.getElementById('code-input').value.trim();
  if (!code) { alert('Bạn chưa nhập code!'); return; }
  if (!currentQ) return;

  const apiKey = getApiKey();
  if (!apiKey) {
    alert('Vui lòng nhập Gemini API key trước khi chấm bài!\nLấy key miễn phí tại: https://aistudio.google.com/apikey');
    document.getElementById('api-key-input').focus();
    return;
  }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.classList.add('loading');
  document.getElementById('loading-overlay').className = 'loading-overlay show';
  document.getElementById('result-panel').className = 'result-panel';

  const systemPrompt = `Bạn là một giáo viên chấm bài lập trình C++ môn Cấu trúc dữ liệu và giải thuật (CTDLGT) tại HUIT. 
Nhiệm vụ: Đọc code C++ của sinh viên và chấm điểm theo rubric được cung cấp.
Trả lời CHÍNH XÁC theo định dạng JSON sau, không thêm gì khác:
{
  "verdict": "correct" | "partial" | "wrong",
  "score": <số từ 0-100>,
  "simulatedOutput": "<output giả lập nếu code chạy>",
  "checks": [
    {"label": "<tên tiêu chí>", "status": "ok"|"warn"|"fail", "note": "<giải thích ngắn>"}
  ],
  "summary": "<nhận xét tổng thể 2-3 câu>",
  "suggestion": "<gợi ý sửa lỗi nếu có, hoặc lời khen nếu đúng>"
}
Chỉ trả về JSON, không markdown, không giải thích thêm.`;

  const userPrompt = buildPrompt(currentQ, code);

  try {
    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: systemPrompt }] },
          contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
          generationConfig: { maxOutputTokens: 1500, temperature: 0.2 }
        })
      }
    );

    if (!response.ok) {
      const errData = await response.json().catch(() => ({}));
      const errMsg = errData?.error?.message || `HTTP ${response.status}`;
      // Friendly error for common issues
      if (response.status === 400 && errMsg.includes('API_KEY')) {
        throw new Error('API key không hợp lệ. Vui lòng kiểm tra lại key tại aistudio.google.com');
      } else if (response.status === 403) {
        throw new Error('API key bị từ chối. Hãy kiểm tra lại quyền truy cập tại Google AI Studio.');
      } else if (response.status === 429) {
        throw new Error('Quá nhiều yêu cầu. Vui lòng chờ một lúc rồi thử lại.');
      }
      throw new Error(errMsg);
    }

    const data = await response.json();
    const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';

    let result;
    try {
      const cleaned = raw.replace(/```json|```/g, '').trim();
      result = JSON.parse(cleaned);
    } catch(e) {
      result = {
        verdict: 'error',
        score: 0,
        simulatedOutput: '',
        checks: [],
        summary: 'Không thể phân tích phản hồi từ AI.',
        suggestion: raw
      };
    }

    results[currentQ.id] = result.verdict;
    renderResult(result);
    renderQuestions();

  } catch(err) {
    renderResult({
      verdict: 'error',
      score: 0,
      simulatedOutput: '',
      checks: [],
      summary: 'Lỗi kết nối API: ' + err.message,
      suggestion: 'Kiểm tra lại API key và kết nối mạng. Lấy key tại: aistudio.google.com/apikey'
    });
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
    document.getElementById('loading-overlay').className = 'loading-overlay';
  }
}

function buildPrompt(q, code) {
  return `BÀI TẬP: ${q.title}
MÔ TẢ: ${q.desc.replace(/<[^>]+>/g,'')}

TIÊU CHÍ CHẤM:
${q.requirements.map((r,i) => `${i+1}. ${r}`).join('\n')}

INPUT MẪU: ${q.sampleIn}
OUTPUT MẪU: ${q.sampleOut}

CODE SINH VIÊN:
\`\`\`cpp
${code}
\`\`\`

H�y:
1. Giả lập output nếu code chạy đúng với input mẫu
2. Kiểm tra từng tiêu chí (ok/warn/fail)
3. Đánh giá verdict: correct (đúng hoàn toàn), partial (đúng một phần), wrong (sai hoàn toàn)
4. Cho điểm 0-100
5. Nhận xét bằng tiếng Việt`;
}

function renderResult(r) {
  const panel = document.getElementById('result-panel');
  
  const verdictMap = {
    correct: { label: 'Đúng hoàn toàn', icon: '✅', cls: 'correct' },
    partial: { label: 'Đúng một phần', icon: '🟡', cls: 'partial' },
    wrong: { label: 'Chưa đúng', icon: '❌', cls: 'wrong' },
    error: { label: 'Lỗi phân tích', icon: '⚠️', cls: 'error' },
  };
  const v = verdictMap[r.verdict] || verdictMap.error;

  const checksHtml = r.checks?.length ? `
    <div class="result-section">
      <div class="rs-header" style="color:var(--text2)">📋 Checklist tiêu chí</div>
      <div class="checklist">
        ${r.checks.map(c => {
          const icon = c.status === 'ok' ? '✓' : c.status === 'warn' ? '⚠' : '✗';
          const cls = c.status === 'ok' ? 'check-ok' : c.status === 'warn' ? 'check-warn' : 'check-no';
          return `<div class="check-item">
            <span class="check-icon ${cls}">${icon}</span>
            <span><strong style="color:var(--text)">${c.label}:</strong> ${c.note}</span>
          </div>`;
        }).join('')}
      </div>
    </div>` : '';

  const outputHtml = r.simulatedOutput ? `
    <div class="result-section">
      <div class="rs-header" style="color:var(--blue)">▶ Output giả lập</div>
      <div class="rs-body">${escapeHtml(r.simulatedOutput)}</div>
    </div>` : '';

  const summaryHtml = r.summary ? `
    <div class="result-section">
      <div class="rs-header" style="color:var(--accent2)">💬 Nhận xét</div>
      <div class="rs-body">${escapeHtml(r.summary)}</div>
    </div>` : '';

  const suggHtml = r.suggestion ? `
    <div class="result-section">
      <div class="rs-header" style="color:${r.verdict==='correct' ? 'var(--green)' : 'var(--yellow)'}">
        ${r.verdict==='correct' ? '🌟 Lời khen' : '🔧 Gợi ý sửa lỗi'}
      </div>
      <div class="rs-body">${escapeHtml(r.suggestion)}</div>
    </div>` : '';

  panel.innerHTML = `
    <div class="result-header ${v.cls}">
      <div class="result-verdict">
        <div class="verdict-icon">${v.icon}</div>
        <div>
          <div class="verdict-text">${v.label}</div>
          <div class="verdict-sub">Bài ${currentQ?.id}: ${currentQ?.title}</div>
        </div>
      </div>
      ${r.score !== undefined ? `<div class="score-badge">${r.score}/100</div>` : ''}
    </div>
    <div class="result-body">
      ${checksHtml}
      ${outputHtml}
      ${summaryHtml}
      ${suggHtml}
    </div>
  `;
  panel.className = 'result-panel show';
  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function clearCode() {
  document.getElementById('code-input').value = '';
  document.getElementById('result-panel').className = 'result-panel';
}

// Tab key in textarea
document.addEventListener('DOMContentLoaded', () => {
  loadSavedKey();
  const ta = document.getElementById('code-input');
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.substring(0,s) + '    ' + ta.value.substring(end);
      ta.selectionStart = ta.selectionEnd = s + 4;
    }
  });
  renderQuestions();
});
</script>
